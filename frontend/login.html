<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AWS Automation Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* Navigation */

        nav {
            background: #111827;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        /* Login */

        .login-container {
            width: 100%;
            max-width: 430px;

            margin: 60px auto;

            padding: 0 20px;
        }

        .login-card {
            background: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .login-card h1 {
            text-align: center;

            margin-bottom: 10px;

            font-size: 30px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 28px;

            line-height: 1.5;
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        /* Success */

        .success-message {
            display: none;

            margin-top: 15px;

            padding: 12px;

            background: #dcfce7;

            color: #166534;

            border-radius: 7px;

            text-align: center;
        }

        /* Login Links */

        .signup-link {
            text-align: center;

            margin-top: 20px;

            color: #6b7280;
        }

        .signup-link a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Footer */

        footer {
            margin-top: auto;

            background: #111827;

            color: white;

            text-align: center;

            padding: 20px;
        }

        footer p {
            color: #d1d5db;

            margin-top: 5px;
        }

        /* Mobile */

        @media (max-width: 600px) {

            nav {
                padding: 18px 20px;
            }

            .nav-links {
                margin-top: 15px;

                gap: 15px;

                flex-wrap: wrap;
            }

            .login-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<!-- Navigation -->

<nav>

    <div class="logo">
        AWS Automation Dashboard
    </div>

    <ul class="nav-links">

        <li>
            <a href="index.html">
                Dashboard
            </a>
        </li>

        <li>
            <a href="signup.html">
                Sign Up
            </a>
        </li>

    </ul>

</nav>


<!-- Login -->

<div class="login-container">

    <div class="login-card">

        <h1>
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to access the
            AWS Automation Dashboard.
        </p>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <div
            id="successMessage"
            class="success-message"
        >
            Login successful! Redirecting...
        </div>


        <div class="signup-link">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>


    </div>

</div>


<!-- Footer -->

<footer>

    <h3>
        AWS Automation Dashboard
    </h3>

    <p>
        Python • Flask • Boto3 • AWS
    </p>

</footer>


<script>

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const successMessage =
                    document.getElementById(
                        "successMessage"
                    );


                successMessage.style.display =
                    "block";


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    1000
                );

            }
        );

</script>


</body>

</html>
